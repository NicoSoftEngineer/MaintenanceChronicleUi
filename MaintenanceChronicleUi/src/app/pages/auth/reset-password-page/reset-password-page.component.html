<section class="flex justify-center items-center flex-col w-full min-h-80screen">

  <mach:alert class="w-25p m-2" type="error"/>
  <div class="rounded-md h-fit shadow-lg shadow-slate-500 w-25p pt-1">
    <form class="p-2 border-0" [formGroup]="formular" (ngSubmit)="formular.valid && formular.markAllAsTouched(); onSubmit()" novalidate>
      <h2 class="text-lg font-bold text-center text-black">Obnovení hesla</h2>
      <mach:forminput formControlName="password" type="password" name="password" [required]="true" label="Heslo"/>
      <mach:forminput formControlName="passwordConfirm" type="password" name="passwordConfirm" [required]="true" label="Potvrdit heslo"/>
      <div class="flex justify-end items-center m-3">
        <button type="submit" class="btn btn-primary">Obnovit heslo</button>
      </div>
    </form>
  </div>
</section>
