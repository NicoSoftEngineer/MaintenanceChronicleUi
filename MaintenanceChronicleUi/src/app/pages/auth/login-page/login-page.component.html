<section class="flex justify-center items-center flex-col w-full min-h-80screen">

  <mach:alert class="md:w-1/4 m-2" type="error"/>
  <div class="rounded-md h-fit shadow-lg shadow-slate-500 md:w-1/4 pt-1">
    <form class="p-2 border-0" [formGroup]="formular" (ngSubmit)="formular.valid && formular.markAllAsTouched(); onSubmit()" novalidate>
      <h2 class="text-lg font-bold text-center text-black">Přihlášení</h2>
      <mach:forminput formControlName="email" type="text" name="email" [required]="true" label="Email" [error]="getErrorMessage(formular.get('email'), 'email')!"/>
      <mach:forminput formControlName="password" type="password" name="password" [required]="true" label="Heslo"/>

      <div class="flex justify-between items-center m-3">
        <div class="flex flex-col me-2">
          <a routerLink="/register" class="text-start text-gray-700 underline hover:no-underline cursor-pointer text-sm mb-1">Nemáte účet? Registrujte se!</a>
          <a routerLink="/forgot-password" class="text-start text-gray-700 underline hover:no-underline cursor-pointer text-sm">Zapomenuté heslo</a>
        </div>
        <button type="submit" class="btn btn-primary p-2">Přihlásit</button>
      </div>
    </form>
  </div>
</section>
